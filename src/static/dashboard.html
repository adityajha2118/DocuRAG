<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuRAG Observability Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 { margin-top: 0; color: var(--text-main); font-weight: 600; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .time-selector {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
        }
        .grid-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .card-title { font-size: 0.875rem; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;}
        .card-value { font-size: 2rem; font-weight: 700; margin-bottom: 4px; }
        .card-subtext { font-size: 0.875rem; color: var(--text-muted); }
        .grid-charts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .chart-container {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            border: 1px solid var(--border);
            height: 300px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }
        th {
            color: var(--text-muted);
            font-size: 0.875rem;
            text-transform: uppercase;
            font-weight: 600;
            background-color: rgba(0,0,0,0.2);
        }
        td { font-size: 0.95rem; }
        .badge {
            padding: 4px 8px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-Success { background-color: rgba(16, 185, 129, 0.2); color: var(--success); }
        .badge-Refused { background-color: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .badge-Error, .badge-Invalid { background-color: rgba(239, 68, 68, 0.2); color: var(--danger); }
        
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; color: var(--accent-hover); }
        
        #loading { display: none; color: var(--text-muted); font-size: 0.9rem; margin-left: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h1>DocuRAG Observability</h1>
            <span style="color: var(--text-muted); font-size: 0.9rem;">Powered by local SQLite metrics & Langfuse</span>
        </div>
        <div>
            <span id="loading">Loading...</span>
            <select class="time-selector" id="timeWindow" onchange="fetchData()">
                <option value="1">Last 1 Hour</option>
                <option value="24" selected>Last 24 Hours</option>
                <option value="168">Last 7 Days</option>
            </select>
        </div>
    </div>

    <div class="grid-summary">
        <div class="card">
            <div class="card-title">P95 Latency</div>
            <div class="card-value" id="val-latency">-- ms</div>
            <div class="card-subtext" id="val-count">-- requests</div>
        </div>
        <div class="card">
            <div class="card-title">Avg Cost / Req</div>
            <div class="card-value" id="val-cost">$--</div>
            <div class="card-subtext" id="val-total-cost">Total: $--</div>
        </div>
        <div class="card">
            <div class="card-title">Citation Coverage</div>
            <div class="card-value" id="val-coverage">--%</div>
            <div class="card-subtext">valid citations</div>
        </div>
        <div class="card">
            <div class="card-title">Failure Rate</div>
            <div class="card-value" id="val-failure" style="color: var(--danger)">--%</div>
            <div class="card-subtext">errors + hallucinations</div>
        </div>
    </div>

    <div class="grid-charts">
        <div class="chart-container">
            <canvas id="latencyChart"></canvas>
        </div>
        <div class="chart-container">
            <canvas id="qualityChart"></canvas>
        </div>
    </div>

    <div class="card" style="padding: 0; overflow: hidden;">
        <div style="padding: 20px; border-bottom: 1px solid var(--border);">
            <h3 style="margin: 0; color: var(--text-main);">Recent Requests</h3>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>Query</th>
                    <th>Latency</th>
                    <th>Cost</th>
                    <th>Status</th>
                    <th>Trace</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr><td colspan="6" style="text-align: center; color: var(--text-muted)">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // Set default Chart.js theme
    Chart.defaults.color = '#94a3b8';
    Chart.defaults.borderColor = '#334155';
    
    let latencyChartInstance = null;
    let qualityChartInstance = null;

    async function fetchData() {
        document.getElementById('loading').style.display = 'inline-block';
        const hours = document.getElementById('timeWindow').value;
        
        try {
            // Fetch summary
            const sumRes = await fetch(`/metrics/summary?hours=${hours}`);
            const summary = await sumRes.json();
            
            // Fetch timeseries
            const tsRes = await fetch(`/metrics/timeseries?hours=${hours}&buckets=12`);
            const tsData = await tsRes.json();
            
            // Fetch recent
            const recentRes = await fetch(`/metrics/recent?limit=10`);
            const recentData = await recentRes.json();
            
            updateSummary(summary);
            updateCharts(tsData.timeseries);
            updateTable(recentData.requests);
            
        } catch (e) {
            console.error("Failed to fetch metrics", e);
            alert("Failed to load metrics. Ensure API is running.");
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }

    function updateSummary(data) {
        document.getElementById('val-latency').innerText = (data.latency.p95 || 0) + ' ms';
        document.getElementById('val-count').innerText = data.latency.count + ' requests';
        
        document.getElementById('val-cost').innerText = '$' + data.cost.avg_cost_usd.toFixed(4);
        document.getElementById('val-total-cost').innerText = 'Total: $' + data.cost.total_cost_usd.toFixed(4);
        
        document.getElementById('val-coverage').innerText = data.citation_coverage.coverage_pct + '%';
        
        const failEl = document.getElementById('val-failure');
        failEl.innerText = data.failure_rate.failure_pct + '%';
        failEl.style.color = data.failure_rate.failure_pct > 5 ? 'var(--danger)' : 'var(--success)';
    }

    function formatTime(isoStr) {
        const d = new Date(isoStr);
        return d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    }

    function updateCharts(timeseries) {
        const labels = timeseries.map(b => formatTime(b.timestamp));
        
        // Latency Chart
        const p50Data = timeseries.map(b => b.p50_latency);
        const p95Data = timeseries.map(b => b.p95_latency);
        
        const ctxLat = document.getElementById('latencyChart').getContext('2d');
        if(latencyChartInstance) latencyChartInstance.destroy();
        latencyChartInstance = new Chart(ctxLat, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    { label: 'P95 Latency (ms)', data: p95Data, borderColor: '#f59e0b', backgroundColor: 'rgba(245, 158, 11, 0.1)', tension: 0.4, fill: true },
                    { label: 'P50 Latency (ms)', data: p50Data, borderColor: '#3b82f6', backgroundColor: 'transparent', tension: 0.4 }
                ]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { title: {display: true, text: 'Latency over time'} } }
        });

        // Quality Chart
        const covData = timeseries.map(b => b.citation_coverage);
        const failData = timeseries.map(b => b.failure_rate);
        
        const ctxQual = document.getElementById('qualityChart').getContext('2d');
        if(qualityChartInstance) qualityChartInstance.destroy();
        qualityChartInstance = new Chart(ctxQual, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    { label: 'Citation Coverage %', data: covData, backgroundColor: '#10b981' },
                    { label: 'Failure Rate %', data: failData, backgroundColor: '#ef4444' }
                ]
            },
            options: { 
                responsive: true, maintainAspectRatio: false, 
                plugins: { title: {display: true, text: 'Quality Metrics'} },
                scales: { y: { beginAtZero: true, max: 100 } }
            }
        });
    }

    function updateTable(requests) {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';
        if (requests.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted)">No recent requests</td></tr>';
            return;
        }
        
        requests.forEach(r => {
            const tr = document.createElement('tr');
            
            let badgeClass = 'badge-Success';
            if (r.status === 'Refused') badgeClass = 'badge-Refused';
            if (r.status === 'Error' || r.status.includes('Invalid')) badgeClass = 'badge-Error';
            
            // Link to self-hosted Langfuse UI (localhost:3000)
            const traceLink = `<a href="http://localhost:3000/project/default/traces/${r.trace_id}" target="_blank">View Trace ↗</a>`;
            
            tr.innerHTML = `
                <td style="color: var(--text-muted); font-size: 0.85rem">${new Date(r.timestamp).toLocaleString()}</td>
                <td><strong style="color: var(--text-main)">${r.query}</strong></td>
                <td>${r.latency_ms} ms</td>
                <td>$${r.cost_usd.toFixed(5)}</td>
                <td><span class="badge ${badgeClass}">${r.status}</span></td>
                <td>${traceLink}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Init
    fetchData();
    // Auto refresh every 30s
    setInterval(fetchData, 30000);
</script>

</body>
</html>
