name: Evaluation Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download indices / models (mocked)
        run: |
          # In a real environment, you might download your persistent chroma db here
          echo "Indices downloaded."

      - name: Run Tests
        run: |
          PYTHONPATH="." pytest tests/ -v

      - name: Run Evaluation Gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          PYTHONPATH="." python eval/run_eval.py --limit 10
          
          # We could enforce performance thresholds (e.g., check if output has specific acc)
          # A real script would output a JSON and we'd parse it.
